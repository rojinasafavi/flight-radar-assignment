<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finland Flight Radar</title>
    <meta name="description" content="Live flight radar tracking airplanes over Finland using OpenSky Network API.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <header class="glass-header">
            <div class="logo">
                <div class="pulse-dot"></div>
                <h1>Suomi Radar</h1>
            </div>
            <div class="status-indicator">
                <span id="update-timer">Connecting...</span>
            </div>
        </header>

        <main>
            <div id="map"></div>
            
            <aside id="flight-details" class="glass-panel hidden">
                <button id="close-details" aria-label="Close details">×</button>
                <div class="details-header">
                    <h2>Flight Details</h2>
                    <h3 id="fd-callsign">Loading...</h3>
                </div>
                <div class="details-content">
                    <div class="data-row">
                        <span class="label">Origin Country</span>
                        <span class="value" id="fd-origin">--</span>
                    </div>
                    <div class="data-row">
                        <span class="label">Altitude</span>
                        <span class="value" id="fd-altitude">-- m</span>
                    </div>
                    <div class="data-row">
                        <span class="label">Velocity</span>
                        <span class="value" id="fd-velocity">-- km/h</span>
                    </div>
                    <div class="data-row">
                        <span class="label">True Track</span>
                        <span class="value" id="fd-heading">-- °</span>
                    </div>
                    <div class="data-row">
                        <span class="label">Vertical Rate</span>
                        <span class="value" id="fd-vrate">-- m/s</span>
                    </div>
                </div>
                <div class="details-footer">
                    <p class="source-info">Data provided by OpenSky Network</p>
                </div>
            </aside>
            
            <div id="global-loading" class="glass-panel text-center hidden">
                <div class="spinner"></div>
                <p>Fetching airspace data...</p>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
